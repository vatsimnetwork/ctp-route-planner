{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
<link rel="stylesheet" href="{% static 'css/map.css' %}">

<div id="container" class="mx-3 mx-md-4">
    <div id="route-div">

        <div class="form-group">
            <label for="routeInput">Route Input</label>
            <textarea class="form-control" id="routeInput" name="route_data" rows="15"></textarea>
            <div id="routeInputError" class="text-danger small mt-2" style="display: none;"></div>
        </div>
        <button  id="plot_route" class="btn btn-primary mt-2">Plot Route</button>
        <button  id="load_route" class="btn btn-secondary mt-2">Load Route</button>
        <button  id="clear_route" class="btn btn-secondary mt-2">Clear Route</button>

    </div>

    <div id="map-div" class="mx-5">
        <div id="map-controls">
            <div class="control-header">Layers</div>
            <div class="form-check">
                <input type="checkbox" id="toggle-fir-lower" checked>
                <label for="toggle-fir-lower">Lower FIR</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="toggle-fir-upper">
                <label for="toggle-fir-upper">Upper UIR</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="toggle-waypoints" >
                <label for="toggle-waypoints">Waypoints</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="toggle-highlighted-waypoints" checked>
                <label for="toggle-highlighted-waypoints">Highlighted</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="toggle-throughput">
                <label for="toggle-throughput">Show Throughput</label>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
<script src="{% static 'js/map-shared.js' %}"></script>

<script>
    const CSRF_TOKEN = '{{ csrf_token }}';
    const PLOT_ROUTE_URL = '{% url "plot_route" %}';
    const GET_FIRS_URL = '{% url "fir_geojson" %}';
    const GET_WAYPOINTS_BASE_URL = '{% url "waypoints_geojson" %}';
    const GET_HIGHLIGHTED_WAYPOINTS_URL = '{% url "highlighted_waypoints_geojson" %}';
    const THROUGHPUT_URL = '{% url "throughput_data" %}';
    const FIR_VISIBILITY_STORAGE_KEY = 'ctp-routeplotter-fir-visibility-v1';

    (function restoreFirVisibilityFromStorage() {
        const raw = localStorage.getItem(FIR_VISIBILITY_STORAGE_KEY);
        if (!raw) return;
        try {
            const state = JSON.parse(raw);
            const lower = document.getElementById('toggle-fir-lower');
            const upper = document.getElementById('toggle-fir-upper');
            if (lower && typeof state.showLower === 'boolean') lower.checked = state.showLower;
            if (upper && typeof state.showUpper === 'boolean') upper.checked = state.showUpper;
        } catch {
            // ignore invalid stored value
        }
    }());

    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';

    const { map, routeLineSource, waypointSource, addWaypoint } = MapShared.createBaseMapKit({
        mapTarget: 'map-div',
        firUrl: GET_FIRS_URL,
        waypointsUrl: GET_WAYPOINTS_BASE_URL,
        highlightedWaypointsUrl: GET_HIGHLIGHTED_WAYPOINTS_URL,
        initialTheme: currentTheme,
        firUpperControlId: 'toggle-fir-upper',
        firLowerControlId: 'toggle-fir-lower',
    });

    function saveFirVisibilityToStorage() {
        const showLower = !!document.getElementById('toggle-fir-lower')?.checked;
        const showUpper = !!document.getElementById('toggle-fir-upper')?.checked;
        localStorage.setItem(FIR_VISIBILITY_STORAGE_KEY, JSON.stringify({ showLower, showUpper }));
    }
    document.getElementById('toggle-fir-lower')?.addEventListener('change', saveFirVisibilityToStorage);
    document.getElementById('toggle-fir-upper')?.addEventListener('change', saveFirVisibilityToStorage);

    const routeLineLayer = new ol.layer.Vector({
        source: routeLineSource,
        zIndex: 10,
        style: function(feature) {
            const userColor = feature.get('userColor');
            const color = userColor || MapShared.getRouteColor(feature.get('group'));
            return [
                new ol.style.Style({ stroke: new ol.style.Stroke({ color: 'rgba(0,0,0,0.45)', width: 4 }) }),
                new ol.style.Style({ stroke: new ol.style.Stroke({ color: color, width: 2 }) }),
            ];
        }
    });
    map.addLayer(routeLineLayer);

    const throughputSource = new ol.source.Vector();
    const throughputLayer = new ol.layer.Vector({
        source: throughputSource,
        zIndex: 16,
        visible: false,
        style: function(feature) {
            return new ol.style.Style({
                text: new ol.style.Text({
                    text: feature.get('label'),
                    font: 'bold 11px monospace',
                    fill: new ol.style.Fill({ color: '#ffffff' }),
                    backgroundFill: new ol.style.Fill({ color: 'rgba(15,23,42,0.82)' }),
                    padding: [2, 5, 2, 5],
                }),
            });
        },
    });
    map.addLayer(throughputLayer);

    function renderThroughputLabels(segments) {
        throughputSource.clear();
        routeLineSource.getFeatures().forEach(function(feature) {
            const identifier = feature.get('identifier');
            if (!identifier) return;
            const tp = segments[identifier];
            if (!tp) return;
            const midpoint = feature.getGeometry().getCoordinateAt(0.5);
            const labelFeature = new ol.Feature({
                geometry: new ol.geom.Point(midpoint),
                label: tp.hourly + '/hr',
            });
            throughputSource.addFeature(labelFeature);
        });
    }

    function loadThroughput() {
        fetch(THROUGHPUT_URL)
            .then(r => r.json())
            .then(data => renderThroughputLabels(data.segments || {}))
            .catch(err => console.error('throughput error:', err));
    }

    document.getElementById('toggle-throughput').addEventListener('change', function() {
        throughputLayer.setVisible(this.checked);
        if (this.checked) loadThroughput();
        else throughputSource.clear();
    });

    const routeInput = document.getElementById('routeInput');
    const routeInputError = document.getElementById('routeInputError');
    let currentRouteInputIssues = [];

    function validateRouteInput(rawText) {
        const issues = [];
        const rawLines = rawText.split('\n');

        rawLines.forEach(function(rawLine, index) {
            const trimmedLine = rawLine.trim();
            if (!trimmedLine) {
                return;
            }

            if (rawLine.includes(',')) {
                issues.push({
                    lineIndex: index,
                    message: `Line ${index + 1}: commas are not allowed.`
                });
            }

            if (/  +/.test(rawLine)) {
                issues.push({
                    lineIndex: index,
                    message: `Line ${index + 1}: double spaces are not allowed.`
                });
            }
        });

        return issues;
    }

    function getRouteInputLineHeight() {
        const computedStyle = window.getComputedStyle(routeInput);
        const parsedLineHeight = parseFloat(computedStyle.lineHeight);
        if (!Number.isNaN(parsedLineHeight)) {
            return parsedLineHeight;
        }

        const parsedFontSize = parseFloat(computedStyle.fontSize);
        return Number.isNaN(parsedFontSize) ? 24 : parsedFontSize * 1.5;
    }

    function highlightRouteInputIssues(issues) {
        const lineHeight = getRouteInputLineHeight();
        const computedStyle = window.getComputedStyle(routeInput);
        const paddingTop = parseFloat(computedStyle.paddingTop) || 0;
        const uniqueLineIndexes = [...new Set(issues.map(issue => issue.lineIndex))];
        const gradients = uniqueLineIndexes.map(function(lineIndex) {
            const top = paddingTop + (lineIndex * lineHeight) - routeInput.scrollTop;
            const bottom = top + lineHeight + 1;
            return `linear-gradient(to bottom, transparent ${top}px, rgba(220, 38, 38, 0.18) ${top}px, rgba(220, 38, 38, 0.18) ${bottom}px, transparent ${bottom}px)`;
        });

        routeInput.style.backgroundImage = gradients.join(', ');
        routeInput.style.backgroundRepeat = 'no-repeat';
        routeInput.classList.toggle('route-input-invalid', uniqueLineIndexes.length > 0);
    }

    function renderRouteInputErrors(issues, forceVisible) {
        if (issues.length === 0) {
            routeInputError.textContent = '';
            routeInputError.style.display = 'none';
            return;
        }

        if (!forceVisible) {
            routeInputError.style.display = 'none';
            return;
        }

        routeInputError.innerHTML = issues.map(issue => issue.message).join('<br>');
        routeInputError.style.display = 'block';
    }

    function refreshRouteInputValidation(forceVisible) {
        currentRouteInputIssues = validateRouteInput(routeInput.value);
        highlightRouteInputIssues(currentRouteInputIssues);
        renderRouteInputErrors(currentRouteInputIssues, forceVisible);
    }

    routeInput.addEventListener('input', function() {
        refreshRouteInputValidation(false);
    });

    routeInput.addEventListener('scroll', function() {
        highlightRouteInputIssues(currentRouteInputIssues);
    });

    document.getElementById('plot_route').addEventListener('click', function() {
        const routeData = routeInput.value;

        refreshRouteInputValidation(true);

        if (currentRouteInputIssues.length > 0) {
            return;
        }

        waypointSource.clear();
        routeLineSource.clear();

        fetch(PLOT_ROUTE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
            body: JSON.stringify({ route: routeData })
        })
        .then(r => r.json())
        .then(data => {
            data.routes.forEach(route => {
                if (route.coords.length > 1) {
                    const lineFeature = new ol.Feature({
                        geometry: new ol.geom.LineString(
                            route.coords.map(c => ol.proj.fromLonLat(c))
                        ),
                        group: route.group,
                        userColor: route.color || '',
                        identifier: route.identifier || '',
                    });
                    routeLineSource.addFeature(lineFeature);
                }
                route.labels.forEach(wp => addWaypoint(wp.lon, wp.lat, wp.identifier));
            });
            if (document.getElementById('toggle-throughput').checked) loadThroughput();
        })
        .catch(err => console.error('plot_route error:', err));
    });
    document.getElementById('clear_route').addEventListener('click', function() {
        routeInput.value = '';
        waypointSource.clear();
        routeLineSource.clear();
        throughputSource.clear();
        refreshRouteInputValidation(false);
    });

    refreshRouteInputValidation(false);
</script>

<style>
    #container {
        display: grid;
        grid-template-columns: minmax(320px, 36%) 1fr;
        gap: 1rem;
        align-items: stretch;
        min-height: calc(100vh - 140px);
        margin-top: 1rem;
        margin-bottom: 1rem;
    }

    #map-div {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 560px;
        background-color: #f8fafc;
        border: 1px solid #d0d7e2;
        border-radius: 10px;
        overflow: hidden;
    }
    #route-div {
        position: relative;
        background-color: rgba(255, 255, 255, 0.92);
        color: #1f2937;
        width: 100%;
        height: fit-content;
        min-height: 560px;
        padding: 24px;
        border: 1px solid #d0d7e2;
        border-radius: 10px;
    }

    #routeInput {
        line-height: 1.5;
        background-attachment: local;
    }

    #routeInput.route-input-invalid {
        border-color: #dc2626;
        box-shadow: 0 0 0 0.1rem rgba(220, 38, 38, 0.15);
    }

    html[data-theme='dark'] #map-div {
        background-color: #000;
        border-color: #333;
    }

    html[data-theme='dark'] #route-div {
        background-color: rgba(20, 20, 20, 0.9);
        color: #ddd;
        border-color: #444;
    }

    html[data-theme='dark'] #routeInput.route-input-invalid {
        border-color: #f87171;
        box-shadow: 0 0 0 0.1rem rgba(248, 113, 113, 0.18);
    }

    @media (max-width: 992px) {
        #container {
            grid-template-columns: 1fr;
            min-height: auto;
        }

        #route-div,
        #map-div {
            min-height: 460px;
        }
    }
</style>
{% endblock %}
