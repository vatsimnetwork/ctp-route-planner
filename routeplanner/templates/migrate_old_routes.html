{% extends 'base.html' %}

{% block title %}Migrate Old Routes{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">Migrate Old Routes</h4>
            <p class="text-muted mb-4">
                This will parse all existing Django routes via the VATSWIM resolver and push them to the CTP API.
            </p>

            <button id="migrate-btn" class="btn btn-primary">Start Migration</button>

            <div id="migration-status" class="mt-4" style="display:none;"></div>
            <div id="migration-errors" class="mt-3" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
(function () {
    const button = document.getElementById('migrate-btn');
    const statusEl = document.getElementById('migration-status');
    const errorsEl = document.getElementById('migration-errors');

    function getCsrfToken() {
        const cookie = document.cookie.split(';').find(v => v.trim().startsWith('csrftoken='));
        return cookie ? decodeURIComponent(cookie.split('=')[1]) : '';
    }

    function setStatus(message, isError) {
        statusEl.style.display = 'block';
        statusEl.className = isError ? 'alert alert-danger mt-4' : 'alert alert-success mt-4';
        statusEl.textContent = message;
    }

    button.addEventListener('click', async function () {
        button.disabled = true;
        errorsEl.style.display = 'none';
        setStatus('Migration running...', false);

        try {
            const response = await fetch("{% url 'migrate_old_routes' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                },
                body: JSON.stringify({}),
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                const details = data.details ? ` Details: ${data.details}` : '';
                setStatus((data.message || data.error || 'Migration failed.') + details, true);
            } else {
                const stats = data.stats || { total: 0, migrated: 0, failed: 0 };
                setStatus(
                    `Done. Total: ${stats.total}, migrated: ${stats.migrated}, failed: ${stats.failed}`,
                    false
                );
            }

            if (Array.isArray(data.errors) && data.errors.length > 0) {
                errorsEl.style.display = 'block';
                errorsEl.className = 'alert alert-warning mt-3';
                errorsEl.innerHTML = '<strong>Skipped routes:</strong><br>' + data.errors
                    .map(e => `${e.identifier}: ${e.error}`)
                    .join('<br>');
            }
        } catch (err) {
            setStatus(`Migration failed: ${err}`, true);
        } finally {
            button.disabled = false;
        }
    });
})();
</script>
{% endblock %}
