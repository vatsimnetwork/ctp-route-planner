{% extends 'base.html' %}

{% block content %}
<style>
    .routes-help-text {
        color: var(--muted-text);
    }

    .route-identifier-input {
        min-width: 240px;
    }

    #filter-bar input::placeholder {
        color: var(--muted-text);
        opacity: 1;
    }
</style>

<div class="container-fluid mt-4">
    <h1>Routes</h1>
    <p class="routes-help-text mb-3">Route ID is generated automatically from the first and last waypoint in the route string. For NAT routes, the identifier can be set manually.</p>

    <div id="alert-container"></div>

    <div id="filter-bar" class="d-flex gap-2 mb-3">
        <input
            type="text"
            id="filter-search"
            class="form-control form-control-sm"
            placeholder="Search identifier or route string…"
            style="max-width:340px"
            oninput="applyFilters()"
        >
        <select id="filter-type" class="form-select form-select-sm" style="max-width:160px" onchange="applyFilters()">
            <option value="">All types</option>
            {% for key, label in route_type_choices %}
            <option value="{{ key }}">{{ label }}</option>
            {% endfor %}
        </select>
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">Clear</button>
    </div>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th style="width:260px">Identifier</th>
                <th style="width:150px">Type</th>
                <th>Route String</th>
                <th style="width:90px">Actions</th>
            </tr>
        </thead>
        <tbody id="routes-tbody">
            {% for route in routes %}
            <tr
                data-pk="{{ route.identifier }}"
                data-original-pk="{{ route.identifier }}"
                data-original-routestring="{{ route.routestring|escapejs }}"
                data-original-type="{{ route.type }}"
                data-is-new="false"
            >
                <td><input type="text" class="form-control form-control-sm route-identifier-input{% if route.type != 'NAT' %} bg-body-secondary{% endif %}" name="identifier" value="{{ route.identifier }}" {% if route.type != 'NAT' %}readonly{% endif %}{% if route.type == 'NAT' %} placeholder="e.g. NATA"{% endif %}></td>
                 <td>
                    <select class="form-select form-select-sm" name="type">
                        {% for key, label in route_type_choices %}
                        <option value="{{ key }}" {% if route.type == key %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </td>
                <td><input type="text" class="form-control form-control-sm" name="routestring" value="{{ route.routestring }}"></td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm" onclick="deleteRow(this)">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary" onclick="addRow()">Add</button>
        <button type="button" class="btn btn-success" onclick="saveAll()">Save All</button>
    </div>
</div>

<script>
const ROUTE_TYPE_CHOICES = {{ route_type_choices_json|safe }};
const CSRF_TOKEN = '{{ csrf_token }}';
const SAVE_URL = '{% url "routes_save" %}';
const DELETE_URL_TEMPLATE = '{% url "route_delete" "__route_id__" %}';

function buildTypeSelect(selectedValue) {
    const options = ROUTE_TYPE_CHOICES.map(([key, label]) =>
        `<option value="${key}" ${key === selectedValue ? 'selected' : ''}>${label}</option>`
    ).join('');
    return `<select class="form-select form-select-sm" name="type">${options}</select>`;
}

function addRow() {
    const tbody = document.getElementById('routes-tbody');
    const tr = document.createElement('tr');
    tr.dataset.pk = '';
    tr.dataset.originalPk = '';
    tr.dataset.originalRoutestring = '';
    tr.dataset.originalType = '';
    tr.dataset.isNew = 'true';
    tr.innerHTML = `
        <td><input type="text" class="form-control form-control-sm bg-body-secondary route-identifier-input" name="identifier" value="" readonly></td>
        <td>${buildTypeSelect(ROUTE_TYPE_CHOICES[0][0])}</td>
        <td><input type="text" class="form-control form-control-sm" name="routestring" value=""></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="deleteRow(this)">Delete</button></td>
    `;
    tbody.appendChild(tr);
    updateIdentifierEditability(tr);
    refreshIdentifierPreviews();
    tr.querySelector('input[name="routestring"]').focus();
}

function buildDeleteUrl(identifier) {
    return DELETE_URL_TEMPLATE.replace('__route_id__', encodeURIComponent(identifier));
}

function updateIdentifierEditability(row) {
    const type = row.querySelector('select[name="type"]').value;
    const identifierInput = row.querySelector('input[name="identifier"]');
    if (type === 'NAT') {
        identifierInput.readOnly = false;
        identifierInput.classList.remove('bg-body-secondary');
        identifierInput.placeholder = 'e.g. NATA';
        identifierInput.value = '';
    } else {
        identifierInput.readOnly = true;
        identifierInput.classList.add('bg-body-secondary');
        identifierInput.placeholder = '';
        identifierInput.value = '';
    }
}

function normalizeRouteString(value) {
    return value.replace(/[,;]/g, ' ').split(/\s+/).map(part => part.trim()).filter(Boolean).join(' ');
}

async function deleteRow(btn) {
    const row = btn.closest('tr');
    if (!row.dataset.originalPk) {
        row.remove();
        refreshIdentifierPreviews();
        return;
    }

    btn.disabled = true;

    try {
        const response = await fetch(buildDeleteUrl(row.dataset.originalPk), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': CSRF_TOKEN,
            },
            body: JSON.stringify({
                original: {
                    pk: row.dataset.originalPk,
                    routestring: row.dataset.originalRoutestring,
                    type: row.dataset.originalType,
                },
            }),
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || 'Delete failed');
        }

        row.remove();
        refreshIdentifierPreviews();
        showAlert('Route deleted successfully.', 'success');
    } catch (error) {
        btn.disabled = false;
        showAlert('Error: ' + error.message, 'danger');
    }
}

function buildIdentifierBase(routestring) {
    const parts = normalizeRouteString(routestring).split(' ').map(part => part.trim().toUpperCase()).filter(Boolean);
    if (!parts.length) {
        return '';
    }
    return `${parts[0]}_${parts[parts.length - 1]}`;
}

function buildUniquePreviewIdentifier(routestring, reservedIdentifiers, currentIdentifier) {
    const base = buildIdentifierBase(routestring);
    if (!base) {
        return '';
    }

    const taken = new Set(reservedIdentifiers);
    if (currentIdentifier) {
        taken.delete(currentIdentifier);
    }

    let suffix = 1;
    let candidate = `${base}_${suffix}`;
    while (taken.has(candidate)) {
        suffix += 1;
        candidate = `${base}_${suffix}`;
    }
    return candidate;
}

function refreshIdentifierPreviews() {
    const rows = Array.from(document.querySelectorAll('#routes-tbody tr'));
    const reservedIdentifiers = new Set();

    rows.forEach(row => {
        const isNew = row.dataset.isNew === 'true';
        const type = row.querySelector('select[name="type"]').value;
        const routestring = normalizeRouteString(row.querySelector('input[name="routestring"]').value);
        const identifierInput = row.querySelector('input[name="identifier"]');

        if (type === 'NAT') {
            const val = identifierInput.value.trim();
            if (val) reservedIdentifiers.add(val);
            return;
        }

        const isChanged = isRowChanged(row);

        if (!isNew && !isChanged) {
            identifierInput.value = row.dataset.originalPk;
            reservedIdentifiers.add(row.dataset.originalPk);
            return;
        }

        const nextIdentifier = buildUniquePreviewIdentifier(routestring, reservedIdentifiers, row.dataset.originalPk);
        if (!nextIdentifier) {
            identifierInput.value = '';
            return;
        }

        identifierInput.value = nextIdentifier;
        reservedIdentifiers.add(nextIdentifier);
    });
}

function isRowChanged(row) {
    const routestring = normalizeRouteString(row.querySelector('input[name="routestring"]').value);
    const type = row.querySelector('select[name="type"]').value;
    const identifier = row.querySelector('input[name="identifier"]').value.trim();
    if (row.dataset.isNew === 'true') {
        return Boolean(routestring) || (type === 'NAT' && Boolean(identifier));
    }
    const identifierChanged = type === 'NAT' && identifier !== row.dataset.originalPk;
    return routestring !== normalizeRouteString(row.dataset.originalRoutestring)
        || type !== row.dataset.originalType
        || identifierChanged;
}

function showAlert(message, type) {
    const container = document.getElementById('alert-container');
    container.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
}

function saveAll() {
    const rows = document.querySelectorAll('#routes-tbody tr');
    const updates = [];
    rows.forEach(row => {
        const pk = row.dataset.pk;
        const routeInput = row.querySelector('input[name="routestring"]');
        const routestring = normalizeRouteString(routeInput.value);
        routeInput.value = routestring;
        const type = row.querySelector('select[name="type"]').value;
        const customIdentifier = type === 'NAT'
            ? row.querySelector('input[name="identifier"]').value.trim().toUpperCase()
            : '';
        if (isRowChanged(row)) {
            updates.push({
                pk,
                ...(type === 'NAT' ? { identifier: customIdentifier } : {}),
                routestring,
                type,
                original: {
                    pk: row.dataset.originalPk,
                    routestring: row.dataset.originalRoutestring,
                    type: row.dataset.originalType,
                },
            });
        }
    });

    if (!updates.length) {
        showAlert('No changes to save.', 'info');
        return;
    }

    fetch(SAVE_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': CSRF_TOKEN,
        },
        body: JSON.stringify({ updates, deletes: [] }),
    })
    .then(res => res.json())
    .then(result => {
        if (result.success) {
            showAlert('Routes saved successfully.', 'success');
            window.location.reload();
        } else {
            showAlert('Error: ' + (result.error || 'Unknown error'), 'danger');
        }
    })
    .catch(err => showAlert('Request failed: ' + err, 'danger'));
}

document.getElementById('routes-tbody').addEventListener('input', event => {
    if (event.target.name === 'routestring') {
        if (/[,;]/.test(event.target.value)) {
            showAlert('Commas and semicolons are not allowed in route strings.', 'warning');
        }
        refreshIdentifierPreviews();
    }
    if (event.target.name === 'identifier') {
        // Auto-uppercase and strip spaces for NAT identifiers
        const cur = event.target.selectionStart;
        event.target.value = event.target.value.replace(/\s/g, '').toUpperCase();
        event.target.setSelectionRange(cur, cur);
        applyFilters();
    }
});

document.getElementById('routes-tbody').addEventListener('change', event => {
    if (event.target.name === 'type') {
        updateIdentifierEditability(event.target.closest('tr'));
        refreshIdentifierPreviews();
    }
    if (event.target.name === 'routestring') {
        event.target.value = normalizeRouteString(event.target.value);
        refreshIdentifierPreviews();
    }
});

refreshIdentifierPreviews();

function applyFilters() {
    const searchTerm = document.getElementById('filter-search').value.trim().toLowerCase();
    const typeFilter = document.getElementById('filter-type').value;

    document.querySelectorAll('#routes-tbody tr').forEach(row => {
        const identifier = (row.querySelector('input[name="identifier"]').value || '').toLowerCase();
        const routestring = (row.querySelector('input[name="routestring"]').value || '').toLowerCase();
        const type = row.querySelector('select[name="type"]').value;

        const matchesSearch = !searchTerm || identifier.includes(searchTerm) || routestring.includes(searchTerm);
        const matchesType = !typeFilter || type === typeFilter;

        row.style.display = (matchesSearch && matchesType) ? '' : 'none';
    });
}

function clearFilters() {
    document.getElementById('filter-search').value = '';
    document.getElementById('filter-type').value = '';
    applyFilters();
}
</script>
{% endblock %}
